name: lofi_frontend
description: "구해조! - 분실물 퀴즈 매칭 서비스"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.3
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  cached_network_image: ^3.4.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo_T.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo_T.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/app_logo.png
    - assets/app_logo_T.png
    - assets/app_logo_f.png
    - assets/app_logo_T_white_N.png
